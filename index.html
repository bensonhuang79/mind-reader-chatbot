<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 讀心聊天機器人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; background:#0A0E14; color:#E6F0EA; font-family:'Noto Sans TC',system-ui,sans-serif; }
  .mono { font-family:'Space Mono','Noto Sans TC',monospace; }
  .wrap { max-width:820px; margin:0 auto; padding:18px; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes scan { from{background-position:0 0} to{background-position:0 22px} }
  .rise { animation:rise .35s ease both; }
  .blur { filter:blur(7px); user-select:none; transition:filter .4s ease; }
  .typing span{ display:inline-block;width:6px;height:6px;border-radius:50%;background:#7CFFCB;margin:0 2px;animation:pulse 1.1s infinite; }
  .typing span:nth-child(2){animation-delay:.18s} .typing span:nth-child(3){animation-delay:.36s}

  header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .logo { width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;
          background:radial-gradient(circle at 30% 30%,#1d3a33,#0c1a17);border:1px solid #1f3d36;
          box-shadow:0 0 24px rgba(124,255,203,.18); }
  h1 { margin:0;font-size:19px;letter-spacing:1px;color:#7CFFCB; }
  .sub { margin:2px 0 0;font-size:12px;color:#6c8077; }

  .panel { border:1px solid #1f3d36;border-radius:14px;padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden; }
  .predict { background:linear-gradient(180deg,#0d1620,#0a1118); }
  .scanlines { position:absolute;inset:0;opacity:.06;pointer-events:none;
               background-image:repeating-linear-gradient(0deg,#7CFFCB 0 1px,transparent 1px 22px);animation:scan 3s linear infinite; }
  .label { font-size:11px;color:#7CFFCB;letter-spacing:1px; }
  .peek { font-size:11px;background:transparent;color:#6c8077;border:1px solid #1f3d36;border-radius:8px;padding:3px 9px;cursor:pointer; }
  .predict-text { font-size:15px;color:#cfe9df;min-height:22px;margin-top:8px; }

  .chat { border:1px solid #1f3d36;border-radius:14px;padding:16px;height:340px;overflow-y:auto;background:#0b1017;margin-bottom:12px; }
  .empty { color:#46584f;text-align:center;margin-top:120px;font-size:14px; }
  .row { display:flex;margin-bottom:10px; }
  .row.user { justify-content:flex-end; }
  .bubble { max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.6; }
  .bubble.user { background:#13352c;border:1px solid #1f5044;color:#dffaef;border-bottom-right-radius:4px; }
  .bubble.bot { background:#141b24;border:1px solid #1d2630;color:#d3ddd8;border-bottom-left-radius:4px; }

  .inputRow { display:flex;gap:8px; }
  input#input { flex:1;padding:12px 14px;border-radius:12px;border:1px solid #1f3d36;background:#0d1620;color:#E6F0EA;font-size:14px;outline:none; }
  #sendBtn { padding:0 20px;border-radius:12px;border:none;cursor:pointer;background:#7CFFCB;color:#06231b;font-weight:700;font-size:14px;letter-spacing:1px;font-family:'Space Mono',monospace; }
  #sendBtn:disabled { background:#1f3d36;color:#6c8077;cursor:default; }
  .err { color:#FF7A8A;font-size:13px;margin-bottom:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🧠</div>
    <div>
      <h1 class="mono">MIND&nbsp;READER&nbsp;//&nbsp;讀心聊天機器人</h1>
      <p class="sub">它每回合偷偷猜你下一句 — 開口後就揭曉「語意相似度」</p>
    </div>
  </header>

  <div class="panel predict">
    <div class="scanlines"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="label mono">▸ AI 預判你接下來會說</span>
      <button id="peekBtn" class="peek mono" style="display:none;">👁 偷看</button>
    </div>
    <div id="predictText" class="predict-text mono">（先跟它聊一句，它才能開始預判）</div>
  </div>

  <div id="comparePanel"></div>

  <div id="chat" class="chat"><div class="empty">試試輸入「我肚子餓了」或「晚餐吃什麼」開始吧 👇</div></div>

  <div id="error" class="err"></div>

  <div class="inputRow">
    <input id="input" placeholder="說點什麼吧…" autocomplete="off" />
    <button id="sendBtn" class="mono">送出</button>
  </div>
</div>

<script>
const state = { messages: [], prediction: "", comparison: null, loading: false, reveal: false, error: "" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gaugeColor = (p) => p >= 70 ? "#7CFFCB" : p >= 40 ? "#FFD66B" : "#FF7A8A";

function renderPredict() {
  const t = $("predictText");
  const peek = $("peekBtn");
  if (state.prediction) {
    t.textContent = "「" + state.prediction + "」";
    t.classList.toggle("blur", !state.reveal);
    peek.style.display = "inline-block";
    peek.textContent = state.reveal ? "🙈 藏起來" : "👁 偷看";
  } else {
    t.textContent = "（先跟它聊一句，它才能開始預判）";
    t.classList.remove("blur");
    peek.style.display = "none";
  }
}

function renderCompare() {
  const c = state.comparison;
  const box = $("comparePanel");
  if (!c) { box.innerHTML = ""; return; }
  const col = gaugeColor(c.sim);
  const dash = (c.sim / 100) * 264;
  box.innerHTML = `
    <div class="panel rise" style="border-color:${col}40;background:#0c1118;">
      <div class="label mono" style="color:#6c8077;margin-bottom:10px;">⚡ 解密上一回合預判</div>
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
        <div style="position:relative;width:92px;height:92px;flex-shrink:0;">
          <svg viewBox="0 0 100 100" width="92" height="92">
            <circle cx="50" cy="50" r="42" fill="none" stroke="#16241f" stroke-width="9"/>
            <circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="${dash} 264" transform="rotate(-90 50 50)"/>
          </svg>
          <div class="mono" style="position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:${col};">${c.sim}%</div>
        </div>
        <div style="flex:1;min-width:200px;font-size:13px;line-height:1.7;">
          <div style="color:#6c8077;">它原本猜你會說：</div>
          <div style="color:#9fb8ad;margin-bottom:6px;">「${esc(c.predicted)}」</div>
          <div style="color:#6c8077;">你實際說的是：</div>
          <div style="color:#E6F0EA;">「${esc(c.actual)}」</div>
        </div>
      </div>
    </div>`;
}

function renderChat() {
  const box = $("chat");
  if (state.messages.length === 0 && !state.loading) {
    box.innerHTML = '<div class="empty">試試輸入「我肚子餓了」或「晚餐吃什麼」開始吧 👇</div>';
    return;
  }
  let html = state.messages.map(m =>
    `<div class="row ${m.role === 'user' ? 'user' : 'bot'} rise">
       <div class="bubble ${m.role === 'user' ? 'user' : 'bot'}">${esc(m.content)}</div>
     </div>`).join("");
  if (state.loading) {
    html += `<div class="row bot"><div class="bubble bot typing"><span></span><span></span><span></span></div></div>`;
  }
  box.innerHTML = html;
  box.scrollTo({ top: box.scrollHeight, behavior: "smooth" });
}

function render() {
  renderPredict(); renderCompare(); renderChat();
  $("error").textContent = state.error;
  $("sendBtn").disabled = state.loading;
}

async function send() {
  const inp = $("input");
  const text = inp.value.trim();
  if (!text || state.loading) return;
  state.error = "";
  inp.value = "";
  const prevPrediction = state.prediction;
  state.messages.push({ role: "user", content: text });
  state.loading = true;
  render();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: state.messages, prevPrediction }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (prevPrediction && data.similarity != null) {
      state.comparison = { predicted: prevPrediction, actual: text, sim: Math.max(0, Math.min(100, data.similarity)) };
    } else {
      state.comparison = null;
    }
    state.messages.push({ role: "assistant", content: data.reply || "（沒有回覆）" });
    state.prediction = data.next_prediction || "";
    state.reveal = false;
  } catch (e) {
    state.error = "連線到 AI 時發生問題：" + (e.message || e);
  } finally {
    state.loading = false;
    render();
  }
}

$("sendBtn").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
$("peekBtn").addEventListener("click", () => { state.reveal = !state.reveal; render(); });

render();
</script>
</body>
</html>
